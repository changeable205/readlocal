name: build-windows

# 手动触发（Actions 页 → Run workflow），或推送 v 开头的 tag 自动构建。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # GitHub windows-latest already ships Rust stable + MSVC build tools.
      - name: Show toolchain
        shell: bash
        run: rustc --version && node --version

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Build Tauri (NSIS .exe + MSI)
        shell: bash
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ReadLocal-Desktop-1.0.0-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
